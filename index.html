<style>
:root{
  --bg:#0b0f14;
  --card:#151b23;
  --card2:#10161d;
  --border:#283342;
  --text:#f4f7fb;
  --muted:#9aa7b7;
  --accent:#18c46e;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(180deg,#080b10,#10151d);
  color:var(--text);
  min-height:100vh;
}

header{
  text-align:center;
  padding:22px 15px 8px;
}

.sub{
  color:var(--text);
  font-size:17px;
  font-weight:800;
  text-align:center;
  margin-bottom:15px;
}

.container{
  max-width:760px;
  margin:auto;
  padding:15px 14px 50px;
}

.tabs{
  display:flex;
  gap:8px;
  margin-bottom:20px;
}

.tab{
  flex:1;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  padding:12px 8px;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

.tab.active{
  background:var(--accent);
  color:#062313;
  border-color:var(--accent);
}

.day{
  display:none;
}

.day.active{
  display:block;
}

.date{
  text-align:center;
  background:var(--card2);
  border:1px solid var(--border);
  padding:12px;
  border-radius:10px;
  margin-bottom:15px;
  color:var(--muted);
  font-weight:bold;
}

.next-date{
  margin-top:25px;
}

.game{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:16px;
  margin-bottom:12px;
  box-shadow:0 4px 15px rgba(0,0,0,.18);
}

.time-row{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

.time{
  display:inline-block;
  background:var(--accent);
  color:#062313;
  font-weight:900;
  padding:5px 9px;
  border-radius:7px;
  font-size:14px;
}

.competition{
  color:#f4f7fb;
  font-weight:800;
  font-size:15px;
}

.teams{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:14px;
  margin:18px 0;
  font-size:17px;
  font-weight:800;
  text-align:center;
}

.team{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  flex:1;
  min-width:0;
}

.team-name{
  line-height:1.2;
}

.team-logo{
  width:42px;
  height:42px;
  object-fit:contain;
  flex-shrink:0;
}

.vs{
  font-size:14px;
  color:var(--muted);
  font-weight:900;
  flex-shrink:0;
}

.info{
  border-top:1px solid var(--border);
  padding-top:10px;
  margin-top:8px;
  display:flex;
  align-items:center;
  gap:18px;
  flex-wrap:wrap;
}

.channel{
  color:#fff;
  font-weight:bold;
  font-size:16px;
  white-space:nowrap;
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:40px 10px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
}

footer{
  text-align:center;
  color:#647080;
  font-size:12px;
  padding:20px;
}

@media(max-width:480px){

  .sub{
    font-size:16px;
  }

  .teams{
    gap:7px;
    font-size:14px;
  }

  .team{
    gap:5px;
  }

  .team-logo{
    width:36px;
    height:36px;
  }

  .vs{
    font-size:12px;
  }

  .tab{
    font-size:12px;
    padding:11px 4px;
  }

  .channel{
    font-size:14px;
  }

  .competition{
    font-size:14px;
  }

  .info{
    gap:12px;
  }
}
</style>

/* =====================================================
   DATA
===================================================== */

function getToday(){

  const now=new Date();

  return new Date(
    now.getFullYear(),
    now.getMonth(),
    now.getDate()
  );

}

function dateToString(dateObj){

  return `${dateObj.getFullYear()}-${
    String(dateObj.getMonth()+1).padStart(2,"0")
  }-${
    String(dateObj.getDate()).padStart(2,"0")
  }`;

}

function parseDate(dateString){

  const parts=dateString.split("-");

  return new Date(
    Number(parts[0]),
    Number(parts[1])-1,
    Number(parts[2])
  );

}

function formatDate(dateObj){

  const days=[
    "DOMINGO",
    "SEGUNDA-FEIRA",
    "TERÇA-FEIRA",
    "QUARTA-FEIRA",
    "QUINTA-FEIRA",
    "SEXTA-FEIRA",
    "SÁBADO"
  ];

  return `📅 ${days[dateObj.getDay()]} – ${
    String(dateObj.getDate()).padStart(2,"0")
  }/${
    String(dateObj.getMonth()+1).padStart(2,"0")
  }/${dateObj.getFullYear()}`;

}


/* =====================================================
   JOGO HTML
===================================================== */

function createGamesHTML(games){

  let html="";

  games.forEach(game=>{

    const homeLogo=logos[game.home] || "";
    const awayLogo=logos[game.away] || "";

    const channelsHTML=game.channels
      .map(channel=>`
        <div class="channel">${channel}</div>
      `)
      .join("");

    html+=`

      <div class="game">

        <div class="time-row">

          <span class="time">
            ${game.time}
          </span>

          <span class="competition">
            ${game.comp}
          </span>

        </div>

        <div class="teams">

          <div class="team">

            <span class="team-name">
              ${game.home}
            </span>

            <img
              class="team-logo"
              src="${homeLogo}"
              alt="${game.home}"
            >

          </div>

          <div class="vs">
            X
          </div>

          <div class="team">

            <img
              class="team-logo"
              src="${awayLogo}"
              alt="${game.away}"
            >

            <span class="team-name">
              ${game.away}
            </span>

          </div>

        </div>

        <div class="info">
          ${channelsHTML}
        </div>

      </div>

    `;

  });

  return html;

}


/* =====================================================
   ORDENAR
===================================================== */

function sortGames(games){

  return games.sort((a,b)=>{

    if(a.date!==b.date)
      return a.date.localeCompare(b.date);

    return a.time.localeCompare(b.time);

  });

}


/* =====================================================
   MONTAR SEÇÃO
===================================================== */

function buildSection(sectionId,games,dateText){

  const container=document.getElementById(sectionId);

  if(games.length===0){

    container.innerHTML=`

      <div class="date">
        ${dateText}
      </div>

      <div class="empty">
        Nenhuma partida agendada.
      </div>

    `;

    return;

  }

  sortGames(games);

  container.innerHTML=`

    <div class="date">
      ${dateText}
    </div>

    ${createGamesHTML(games)}

  `;

}


/* =====================================================
   RENDERIZAR
===================================================== */

function renderGames(){

  const today=getToday();

  const tomorrow=new Date(today);

  tomorrow.setDate(
    tomorrow.getDate()+1
  );

  const todayStr=dateToString(today);
  const tomorrowStr=dateToString(tomorrow);

  const todayGames=gamesData.filter(
    game=>game.date===todayStr
  );

  const tomorrowGames=gamesData.filter(
    game=>game.date===tomorrowStr
  );

  const nextGames=gamesData.filter(
    game=>game.date>tomorrowStr
  );

  buildSection(
    "today",
    todayGames,
    formatDate(today)
  );

  buildSection(
    "tomorrow",
    tomorrowGames,
    formatDate(tomorrow)
  );


  const nextContainer=document.getElementById("next");

  if(nextGames.length===0){

    nextContainer.innerHTML=`

      <div class="date">
        📅 PRÓXIMOS JOGOS
      </div>

      <div class="empty">
        Nenhuma partida futura cadastrada.
      </div>

    `;

    return;

  }


  sortGames(nextGames);

  const grouped={};

  nextGames.forEach(game=>{

    if(!grouped[game.date])
      grouped[game.date]=[];

    grouped[game.date].push(game);

  });


  let html="";

  Object.keys(grouped)
    .sort()
    .forEach((date,index)=>{

      html+=`

        <div class="date ${index>0?"next-date":""}">
          ${formatDate(parseDate(date))}
        </div>

        ${createGamesHTML(grouped[date])}

      `;

    });


  nextContainer.innerHTML=html;

}


/* =====================================================
   ABAS
===================================================== */

function showDay(id,button){

  document
    .querySelectorAll(".day")
    .forEach(day=>{
      day.classList.remove("active");
    });

  document
    .querySelectorAll(".tab")
    .forEach(tab=>{
      tab.classList.remove("active");
    });

  document
    .getElementById(id)
    .classList.add("active");

  button.classList.add("active");

}


/* =====================================================
   INICIAR
===================================================== */

renderGames();
