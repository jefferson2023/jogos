<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Programação de Jogos e Transmissões</title>

<style>

:root{
  --bg:#0b0f14;
  --card:#151b23;
  --card2:#10161d;
  --border:#283342;
  --text:#f4f7fb;
  --muted:#9aa7b7;
  --accent:#18c46e;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

header{
  text-align:center;
  padding:20px 12px 14px;
  font-size:22px;
  font-weight:800;
  border-bottom:1px solid var(--border);
}

.tabs{
  display:flex;
  justify-content:center;
  gap:8px;
  padding:14px 10px;
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(11,15,20,.96);
  backdrop-filter:blur(8px);
}

.tab{
  border:1px solid var(--border);
  background:var(--card);
  color:var(--muted);
  padding:10px 18px;
  border-radius:10px;
  font-size:14px;
  font-weight:800;
  cursor:pointer;
  transition:.2s;
}

.tab:hover{
  border-color:var(--accent);
}

.tab.active{
  background:var(--accent);
  color:#07120c;
  border-color:var(--accent);
}

.container{
  width:100%;
  max-width:900px;
  margin:0 auto;
  padding:8px 12px 40px;
}


/* =========================================================
   DIA E DATA CENTRALIZADOS
   ========================================================= */

.day-title{
  margin:16px 0 12px;
  padding:12px 14px;
  background:var(--card2);
  border:1px solid var(--border);
  border-radius:12px;

  display:flex;
  justify-content:center;
  align-items:center;

  text-align:center;

  font-size:15px;
  font-weight:800;
}


/* =========================================================
   CARD DO JOGO
   ========================================================= */

.game{
  background:linear-gradient(145deg,var(--card),var(--card2));
  border:1px solid var(--border);
  border-radius:14px;
  margin-bottom:10px;
  overflow:hidden;
  box-shadow:0 4px 15px rgba(0,0,0,.18);
}


/* =========================================================
   TOPO DO JOGO
   ========================================================= */

.game-top{
  position:relative;

  display:flex;
  align-items:center;
  justify-content:center;

  min-height:48px;

  padding:8px 12px;

  border-bottom:1px solid rgba(255,255,255,.05);
}


/* HORÁRIO */

.time{
  position:absolute;
  left:12px;

  font-size:18px;
  font-weight:900;
  color:#fff;

  min-width:58px;

  text-align:left;
}


/* =========================================================
   COMPETIÇÃO CENTRALIZADA
   ========================================================= */

.competition{
  display:flex;
  align-items:center;
  justify-content:center;

  gap:7px;

  max-width:75%;

  text-align:center;

  font-size:12px;
  font-weight:800;
  color:var(--muted);
}

.competition-logo{
  width:22px;
  height:22px;

  object-fit:contain;

  flex:none;
}

.competition-logo.champions-logo{
  filter:brightness(0) invert(1);
}

.competition-logo.libertadores-logo{
  filter:none;
}

.competition-logo.sulamericana-logo{
  filter:none;
}

.competition-name{
  line-height:1.15;
}


/* =========================================================
   TIMES
   ========================================================= */

.teams{
  display:grid;

  grid-template-columns:1fr 35px 1fr;

  align-items:center;

  gap:8px;

  padding:12px 12px 8px;
}

.team{
  display:flex;
  align-items:center;

  gap:9px;

  min-width:0;
}

.team.home{
  justify-content:flex-end;
  text-align:right;
}

.team.away{
  justify-content:flex-start;
  text-align:left;
}

.team-name{
  font-size:14px;
  font-weight:800;
  line-height:1.15;
}

.team-logo{
  width:42px;
  height:42px;

  object-fit:contain;

  flex:none;
}

.vs{
  text-align:center;

  font-size:11px;
  font-weight:900;

  color:var(--muted);
}


/* =========================================================
   CANAIS
   ========================================================= */

.channels{
  display:flex;
  flex-wrap:wrap;

  justify-content:center;

  gap:7px;

  padding:2px 12px 12px;
}

.channel{
  background:#0b1118;

  border:1px solid var(--border);

  border-radius:8px;

  padding:6px 10px;

  color:#fff;

  font-size:12px;
  font-weight:800;
}


/* =========================================================
   SEM JOGOS
   ========================================================= */

.empty{
  text-align:center;

  color:var(--muted);

  padding:35px 15px;

  border:1px dashed var(--border);

  border-radius:12px;

  margin-top:15px;
}


/* =========================================================
   CELULAR
   ========================================================= */

@media(max-width:600px){

  header{
    font-size:18px;
    padding:17px 8px 13px;
  }

  .tabs{
    gap:5px;
  }

  .tab{
    padding:9px 12px;
    font-size:12px;
  }

  .container{
    padding-left:8px;
    padding-right:8px;
  }


  /* DIA CENTRALIZADO */

  .day-title{
    font-size:14px;
    padding:11px 8px;
  }


  /* TOPO */

  .game-top{
    min-height:45px;
    padding:7px 8px;
  }


  /* HORÁRIO */

  .time{
    left:8px;

    font-size:15px;

    min-width:48px;
  }


  /* COMPETIÇÃO */

  .competition{
    max-width:70%;

    gap:5px;

    font-size:10px;
  }

  .competition-logo{
    width:20px;
    height:20px;
  }


  /* TIMES */

  .teams{
    grid-template-columns:1fr 28px 1fr;

    gap:5px;

    padding:11px 8px 7px;
  }

  .team{
    gap:6px;
  }

  .team-logo{
    width:36px;
    height:36px;
  }

  .team-name{
    font-size:12px;
  }

  .vs{
    font-size:9px;
  }


  /* CANAIS */

  .channel{
    font-size:11px;
    padding:5px 8px;
  }

}

</style>

/* =========================================================
   DATA ATUAL
   ========================================================= */

function getLocalDate(){

  const now = new Date();

  const year = now.getFullYear();
  const month = String(now.getMonth()+1).padStart(2,"0");
  const day = String(now.getDate()).padStart(2,"0");

  return `${year}-${month}-${day}`;

}


/* =========================================================
   ADICIONAR DIAS
   ========================================================= */

function addDays(dateString, days){

  const date = new Date(dateString + "T12:00:00");

  date.setDate(date.getDate() + days);

  const year = date.getFullYear();
  const month = String(date.getMonth()+1).padStart(2,"0");
  const day = String(date.getDate()).padStart(2,"0");

  return `${year}-${month}-${day}`;

}


/* =========================================================
   FORMATAÇÃO DA DATA
   ========================================================= */

function formatDate(dateString){

  const date = new Date(dateString + "T12:00:00");

  const days = [
    "DOMINGO",
    "SEGUNDA-FEIRA",
    "TERÇA-FEIRA",
    "QUARTA-FEIRA",
    "QUINTA-FEIRA",
    "SEXTA-FEIRA",
    "SÁBADO"
  ];

  return `${days[date.getDay()]} – ${date.toLocaleDateString("pt-BR")}`;

}


/* =========================================================
   LOGO DA COMPETIÇÃO
   ========================================================= */

function createCompetitionLogo(comp){

  const src = competitionLogos[comp];

  if(!src){
    return "";
  }

  let extraClass = "";

  if(comp === "UEFA Champions League"){
    extraClass = " champions-logo";
  }

  if(comp === "CONMEBOL Libertadores"){
    extraClass = " libertadores-logo";
  }

  if(comp === "CONMEBOL Sul-Americana"){
    extraClass = " sulamericana-logo";
  }

  return `
    <img
      class="competition-logo${extraClass}"
      src="${src}"
      alt=""
      onerror="this.style.display='none'"
    >
  `;

}


/* =========================================================
   CRIAR JOGO
   ========================================================= */

function createGame(game){

  const homeLogo = logos[game.home] || "";
  const awayLogo = logos[game.away] || "";

  const competitionLogo = createCompetitionLogo(game.comp);

  const competitionExtra = game.compExtra || "";

  return `

    <div class="game">

      <div class="game-top">

        <div class="time">
          ${game.time}
        </div>

        <div class="competition">

          ${competitionLogo}

          <span class="competition-name">
            ${game.comp}${competitionExtra}
          </span>

        </div>

      </div>


      <div class="teams">

        <div class="team home">

          <span class="team-name">
            ${game.home}
          </span>

          ${
            homeLogo
            ?
            `
            <img
              class="team-logo"
              src="${homeLogo}"
              alt="${game.home}"
              onerror="this.style.display='none'"
            >
            `
            :
            ""
          }

        </div>


        <div class="vs">
          VS
        </div>


        <div class="team away">

          ${
            awayLogo
            ?
            `
            <img
              class="team-logo"
              src="${awayLogo}"
              alt="${game.away}"
              onerror="this.style.display='none'"
            >
            `
            :
            ""
          }

          <span class="team-name">
            ${game.away}
          </span>

        </div>

      </div>


      <div class="channels">

        ${
          game.channels.map(channel => `
            <div class="channel">
              ${channel}
            </div>
          `).join("")
        }

      </div>

    </div>

  `;

}


/* =========================================================
   RENDERIZAR
   ========================================================= */

function renderGames(tab){

  const container = document.getElementById("gamesContainer");

  const today = getLocalDate();

  const tomorrow = addDays(today,1);

  let filteredGames = [];


  if(tab === "today"){

    filteredGames = gamesData.filter(game =>
      game.date === today
    );

  }


  else if(tab === "tomorrow"){

    filteredGames = gamesData.filter(game =>
      game.date === tomorrow
    );

  }


  else if(tab === "next"){

    filteredGames = gamesData.filter(game =>
      game.date > tomorrow
    );

  }


  filteredGames.sort((a,b) => {

    const dateA = `${a.date} ${a.time}`;
    const dateB = `${b.date} ${b.time}`;

    return dateA.localeCompare(dateB);

  });


  if(filteredGames.length === 0){

    container.innerHTML = `
      <div class="empty">
        Nenhum jogo programado para esta data.
      </div>
    `;

    return;

  }


  const groups = {};


  filteredGames.forEach(game => {

    if(!groups[game.date]){
      groups[game.date] = [];
    }

    groups[game.date].push(game);

  });


  let html = "";


  Object.keys(groups)
    .sort()
    .forEach(date => {

      html += `
        <div class="day-title">
          📅 ${formatDate(date)}
        </div>
      `;


      groups[date].forEach(game => {

        html += createGame(game);

      });

    });


  container.innerHTML = html;

}


/* =========================================================
   ABAS
   ========================================================= */

document.querySelectorAll(".tab").forEach(tab => {

  tab.addEventListener("click", () => {

    document.querySelectorAll(".tab")
      .forEach(button =>
        button.classList.remove("active")
      );

    tab.classList.add("active");

    renderGames(tab.dataset.tab);

  });

});


/* =========================================================
   INICIAR
   ========================================================= */

renderGames("today");

</script>
