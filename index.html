<meta charset="UTF-8">

<title>JTV | Jogos de Hoje</title>
<style>
:root{
  --bg:#0b0f14;
  --card:#151b23;
  --card2:#10161d;
  --border:#283342;
  --text:#f4f7fb;
  --muted:#9aa7b7;
  --accent:#18c46e;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}
.container{
  width:min(760px,100%);
  margin:auto;
  padding:14px;
}
header{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:16px;
  text-align:center;
  font-size:20px;
  font-weight:900;
}
.tabs{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin:12px 0;
}
.tab{
  border:1px solid var(--border);
  background:var(--card);
  color:var(--muted);
  border-radius:10px;
  padding:11px 8px;
  font-weight:900;
  cursor:pointer;
}
.tab.active{
  color:#fff;
  background:var(--accent);
  border-color:var(--accent);
}
.day-title{
  margin:16px 0 12px;
  padding:12px 14px;
  background:var(--card2);
  border:1px solid var(--border);
  border-radius:12px;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  font-size:15px;
  font-weight:800;
}
.game{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  overflow:hidden;
  margin-bottom:10px;
}
.game-top{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:48px;
  padding:8px 12px;
  border-bottom:1px solid rgba(255,255,255,.05);
}
.time{
  position:absolute;
  left:12px;
  font-size:18px;
  font-weight:900;
  color:#fff;
  min-width:58px;
  text-align:left;
}
.competition{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  max-width:75%;
  text-align:center;
  font-size:12px;
  font-weight:800;
  color:var(--muted);
}
.competition-logo{
  width:22px;
  height:22px;
  object-fit:contain;
  flex:none;
}
.competition-logo.champions-logo{filter:brightness(0) invert(1)}
.competition-logo.libertadores-logo{filter:none}
.competition-logo.sulamericana-logo{filter:none}
.teams{
  display:grid;
  grid-template-columns:1fr 35px 1fr;
  align-items:center;
  gap:8px;
  padding:12px 12px 8px;
}
.team{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:14px;
  font-weight:900;
  min-width:0;
}
.team.home{justify-content:flex-end;text-align:right}
.team.away{justify-content:flex-start;text-align:left}
.team-name{line-height:1.15}
.team-logo{
  width:42px;
  height:42px;
  object-fit:contain;
  flex:none;
  display:block;
}
.vs{
  text-align:center;
  color:var(--muted);
  font-size:12px;
  font-weight:900;
}
.channels{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:6px;
  padding:7px 10px 12px;
}
.channel{
  background:#0d131a;
  border:1px solid var(--border);
  border-radius:8px;
  padding:7px 9px;
  color:#fff;
  font-size:12px;
  font-weight:800;
}
.empty{
  text-align:center;
  color:var(--muted);
  padding:35px 10px;
}
@media(max-width:520px){
  .container{padding:9px}
  header{font-size:17px;padding:14px}
  .game-top{min-height:45px}
  .time{font-size:16px;left:10px;min-width:50px}
  .competition{font-size:11px;max-width:72%}
  .competition-logo{width:20px;height:20px}
  .team{font-size:12px;gap:5px}
  .team-logo{width:36px;height:36px}
  .teams{grid-template-columns:1fr 30px 1fr;gap:5px;padding:10px 8px 7px}
  .channel{font-size:11px;padding:6px 7px}
}

function renderGames(tabKey) {
  const container = document.getElementById("games");
  const tabData = gamesData[tabKey];

  if (!tabData || !tabData.matches || tabData.matches.length === 0) {
    container.innerHTML = `<div class="empty">Nenhum jogo agendado para este dia.</div>`;
    return;
  }

  let html = `<div class="day-title">${tabData.title}</div>`;

  tabData.matches.forEach(match => {
    const compLogo = competitionLogos[match.competition] || "";
    const homeLogo = logos[match.homeTeam] || "";
    const awayLogo = logos[match.awayTeam] || "";

    const channelsHtml = match.channels
      .map(ch => `<span class="channel">${ch}</span>`)
      .join("");

    html += `
      <div class="game">
        <div class="game-top">
          <span class="time">${match.time}</span>
          <div class="competition">
            ${compLogo ? `<img class="competition-logo" src="${compLogo}" alt="${match.competition}">` : ""}
            <span>${match.competition}</span>
          </div>
        </div>
        <div class="teams">
          <div class="team home">
            <span class="team-name">${match.homeTeam}</span>
            ${homeLogo ? `<img class="team-logo" src="${homeLogo}" alt="${match.homeTeam}">` : ""}
          </div>
          <div class="vs">VS</div>
          <div class="team away">
            ${awayLogo ? `<img class="team-logo" src="${awayLogo}" alt="${match.awayTeam}">` : ""}
            <span class="team-name">${match.awayTeam}</span>
          </div>
        </div>
        <div class="channels">
          ${channelsHtml}
        </div>
      </div>
    `;
  });

  container.innerHTML = html;
}

document.querySelectorAll(".tab").forEach(button => {
  button.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(btn => btn.classList.remove("active"));
    button.classList.add("active");
    renderGames(button.dataset.tab);
  });
});
