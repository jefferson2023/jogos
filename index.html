<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Programação de Jogos e Transmissões</title>

<style>
:root{
  --bg:#0b0f14;
  --card:#151b23;
  --card2:#10161d;
  --border:#283342;
  --text:#f4f7fb;
  --muted:#9aa7b7;
  --accent:#18c46e;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

.container{
  width:100%;
  max-width:900px;
  margin:0 auto;
  padding:14px;
}

/* CABEÇALHO */

header{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:18px 14px;
  text-align:center;
  margin-bottom:12px;
}

header h1{
  margin:0;
  font-size:20px;
  font-weight:900;
}

/* ABAS */

.tabs{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:14px;
}

.tab{
  border:1px solid var(--border);
  background:var(--card);
  color:var(--muted);
  border-radius:10px;
  padding:11px 8px;
  font-size:13px;
  font-weight:900;
  cursor:pointer;
  text-align:center;
}

.tab.active{
  background:var(--accent);
  border-color:var(--accent);
  color:#06130c;
}

/* DIA */

.day-title{
  margin:16px 0 12px;
  padding:12px 14px;
  background:var(--card2);
  border:1px solid var(--border);
  border-radius:12px;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  font-size:15px;
  font-weight:800;
}

/* JOGO */

.game{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  margin-bottom:12px;
  overflow:hidden;
}

/* TOPO */

.game-top{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:48px;
  padding:8px 12px;
  border-bottom:1px solid rgba(255,255,255,.05);
}

.time{
  position:absolute;
  left:12px;
  font-size:18px;
  font-weight:900;
  color:#fff;
  min-width:58px;
  text-align:left;
}

.competition{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  max-width:75%;
  text-align:center;
  font-size:12px;
  font-weight:800;
  color:var(--muted);
}

.competition-logo{
  width:22px;
  height:22px;
  object-fit:contain;
  flex:none;
}

.competition-logo.champions-logo{
  filter:brightness(0) invert(1);
}

.competition-logo.libertadores-logo{
  filter:none;
}

.competition-logo.sulamericana-logo{
  filter:none;
}

/* TIMES */

.teams{
  display:grid;
  grid-template-columns:1fr 35px 1fr;
  align-items:center;
  gap:8px;
  padding:12px 12px 8px;
}

.team{
  display:flex;
  align-items:center;
  gap:8px;
  min-width:0;
}

.team.home{
  justify-content:flex-end;
  text-align:right;
}

.team.away{
  justify-content:flex-start;
  text-align:left;
}

.team-name{
  font-size:14px;
  font-weight:800;
  line-height:1.15;
}

.team-logo{
  width:42px;
  height:42px;
  object-fit:contain;
  flex:none;
}

.vs{
  text-align:center;
  color:var(--muted);
  font-size:12px;
  font-weight:900;
}

/* CANAIS */

.channels{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:6px;
  padding:7px 12px 13px;
}

.channel{
  background:#0e141b;
  border:1px solid var(--border);
  border-radius:8px;
  padding:6px 9px;
  font-size:12px;
  font-weight:800;
  color:#fff;
}

/* SEM JOGOS */

.empty{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:25px 15px;
  text-align:center;
  color:var(--muted);
  font-size:14px;
}

/* MOBILE */

@media(max-width:600px){

  .container{
    padding:10px;
  }

  header h1{
    font-size:17px;
  }

  .tab{
    font-size:11px;
    padding:10px 5px;
  }

  .game-top{
    min-height:45px;
  }

  .time{
    font-size:16px;
    left:10px;
  }

  .competition{
    font-size:11px;
    max-width:70%;
  }

  .competition-logo{
    width:20px;
    height:20px;
  }

  .teams{
    grid-template-columns:1fr 30px 1fr;
    gap:5px;
    padding:11px 8px 7px;
  }

  .team-logo{
    width:36px;
    height:36px;
  }

  .team-name{
    font-size:12px;
  }

  .vs{
    font-size:11px;
  }

  .channel{
    font-size:11px;
  }
}
</style>
</head>

/* =========================================================
   DATA
========================================================= */

function getLocalDate(){

  const now = new Date();

  const year = now.getFullYear();
  const month = String(now.getMonth()+1).padStart(2,"0");
  const day = String(now.getDate()).padStart(2,"0");

  return `${year}-${month}-${day}`;
}


function addDays(dateString,days){

  const parts = dateString.split("-").map(Number);

  const date = new Date(
    parts[0],
    parts[1]-1,
    parts[2]
  );

  date.setDate(date.getDate()+days);

  const y = date.getFullYear();
  const m = String(date.getMonth()+1).padStart(2,"0");
  const d = String(date.getDate()).padStart(2,"0");

  return `${y}-${m}-${d}`;
}


function formatDate(dateString){

  const parts = dateString.split("-").map(Number);

  const date = new Date(
    parts[0],
    parts[1]-1,
    parts[2]
  );

  return date
    .toLocaleDateString(
      "pt-BR",
      {
        weekday:"long",
        day:"2-digit",
        month:"2-digit",
        year:"numeric"
      }
    )
    .replace(/^./,m=>m.toUpperCase());
}


/* =========================================================
   LOGO DA COMPETIÇÃO
========================================================= */

function createCompetitionLogo(comp){

  const url = competitionLogos[comp];

  if(!url){
    return "";
  }

  let className = "competition-logo";

  if(comp === "UEFA Champions League"){
    className += " champions-logo";
  }

  if(comp === "CONMEBOL Libertadores"){
    className += " libertadores-logo";
  }

  if(comp === "CONMEBOL Sul-Americana"){
    className += " sulamericana-logo";
  }

  return `
    <img
      src="${url}"
      class="${className}"
      alt="${comp}"
      onerror="this.style.display='none'"
    >
  `;
}


/* =========================================================
   CRIA JOGO
========================================================= */

function createGame(game){

  const homeLogo = logos[game.home] || "";
  const awayLogo = logos[game.away] || "";

  const competitionLogo =
    createCompetitionLogo(game.comp);

  return `

    <div class="game">

      <div class="game-top">

        <div class="time">
          ${game.time}
        </div>

        <div class="competition">

          ${competitionLogo}

          <span>
            ${game.comp}
          </span>

        </div>

      </div>


      <div class="teams">

        <div class="team home">

          <span class="team-name">
            ${game.home}
          </span>

          ${
            homeLogo
            ?
            `<img
              src="${homeLogo}"
              class="team-logo"
              alt="${game.home}"
              onerror="this.style.display='none'"
            >`
            :
            ""
          }

        </div>


        <div class="vs">
          VS
        </div>


        <div class="team away">

          ${
            awayLogo
            ?
            `<img
              src="${awayLogo}"
              class="team-logo"
              alt="${game.away}"
              onerror="this.style.display='none'"
            >`
            :
            ""
          }

          <span class="team-name">
            ${game.away}
          </span>

        </div>

      </div>


      <div class="channels">

        ${
          game.channels.map(channel => `
            <span class="channel">
              ${channel}
            </span>
          `).join("")
        }

      </div>

    </div>

  `;
}


/* =========================================================
   RENDERIZA
========================================================= */

function renderGames(tab){

  const container =
    document.getElementById("games");

  const today =
    getLocalDate();

  const tomorrow =
    addDays(today,1);

  let filtered = [];

  if(tab === "today"){

    filtered =
      gamesData.filter(
        game => game.date === today
      );

  }

  else if(tab === "tomorrow"){

    filtered =
      gamesData.filter(
        game => game.date === tomorrow
      );

  }

  else if(tab === "next"){

    filtered =
      gamesData.filter(
        game => game.date > tomorrow
      );

  }


  filtered.sort((a,b)=>{

    if(a.date !== b.date){
      return a.date.localeCompare(b.date);
    }

    return a.time.localeCompare(b.time);

  });


  if(filtered.length === 0){

    container.innerHTML = `
      <div class="empty">
        Nenhum jogo programado para este período.
      </div>
    `;

    return;
  }


  const groups = {};


  filtered.forEach(game=>{

    if(!groups[game.date]){
      groups[game.date] = [];
    }

    groups[game.date].push(game);

  });


  let html = "";


  Object.keys(groups).forEach(date=>{

    html += `

      <div class="day-title">
        📅 ${formatDate(date)}
      </div>

    `;


    groups[date].forEach(game=>{

      html += createGame(game);

    });

  });


  container.innerHTML = html;

}


/* =========================================================
   ABAS
========================================================= */

document
  .querySelectorAll(".tab")
  .forEach(button=>{

    button.addEventListener("click",()=>{

      document
        .querySelectorAll(".tab")
        .forEach(tab=>{
          tab.classList.remove("active");
        });

      button.classList.add("active");

      renderGames(
        button.dataset.tab
      );

    });

  });

renderGames("today");
